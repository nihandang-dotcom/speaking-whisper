<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaking Practice</title>
</head>

<body>

  <h1>Speaking Practice</h1>

  <p>Upload your speaking recording:</p>

  <input
    type="file"
    id="audioFile"
    accept="audio/*,video/*"
  >

  <br><br>

  <button onclick="loadWhisper()">
    Load Whisper
  </button>

  <button onclick="transcribe()">
    Transcribe
  </button>

  <p id="status">
    Whisper chưa được tải.
  </p>

  <textarea
    id="result"
    rows="10"
    cols="60"
    placeholder="Your transcript will appear here..."
  ></textarea>

  <script type="module">
    import {
      loadWhisper,
      transcribe
    } from "./whisper.js";

    window.loadWhisper = loadWhisper;
    window.transcribe = transcribe;
  </script>

</body>
</html>
